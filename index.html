<style>

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#f3f8ff 0%,#e9f3ff 100%);color:var(--text)}
button,input,select,textarea{font:inherit}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:16px}

label{display:block;font-weight:750;font-size:.9rem}
textarea{min-height:88px;resize:vertical}
.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted);font-size:.92rem}
.section{margin-bottom:20px}
.section h2{margin:5px 0 13px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}
.value{font-size:1.9rem;font-weight:900;color:var(--brand)}

.status{padding:10px;border-radius:10px;background:#ebf8f0;color:var(--success);margin:10px 0}
.warning{background:#fff5e3;color:#84540e;padding:12px;border-radius:12px;border:1px solid #f1ddae}

async function loadWeather(force=false){
 if(weatherLoading)return;
 if(!force&&weatherData&&Date.now()-weatherUpdated<15*60*1000)return;
 weatherLoading=true;weatherError='';
 const loc=weatherLocations[selectedWeather];
 try{
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m&hourly=temperature_2m,precipitation_probability,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=America%2FChicago&forecast_days=5`;
  const res=await fetch(url);
  if(!res.ok)throw new Error('Weather service returned '+res.status);
  weatherData=await res.json();weatherUpdated=Date.now();
 }catch(err){weatherData=null;weatherError='Live weather could not load. Check your internet connection and try Refresh.';}
 finally{weatherLoading=false;if(['home','weather'].includes(active))render();}
}

async function compressCatchPhoto(file){
  if(!file.type.startsWith('image/')||file.size>12*1024*1024)throw new Error('Invalid photo');
  const blob=URL.createObjectURL(file);
  try{
    const img=new Image();img.src=blob;
    await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject});
    const ratio=Math.min(1,1000/Math.max(img.naturalWidth,img.naturalHeight));
    const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*ratio));canvas.height=Math.max(1,Math.round(img.naturalHeight*ratio));
    canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
    return canvas.toDataURL('image/jpeg',.70);
  }finally{URL.revokeObjectURL(blob)}
}
